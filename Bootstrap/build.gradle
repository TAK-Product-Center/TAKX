description = 'Bootstrap'

ext {
    producesLoadJar = true // Causes jar copy task to be configured
}

configurations {
    create 'bootLibs' // These will be copied into bin/boot
    implementation.extendsFrom bootLibs
}

dependencies {
    bootLibs "org.jboss.modules:jboss-modules:$jbossModulesVersion"

    implementation "org.aspectj:aspectjrt:$aspectjVersion"
    implementation "org.aspectj:aspectjweaver:$aspectjVersion"

    implementation "org.slf4j:slf4j-api:$slf4jApiVersion"
    implementation "org.apache.logging.log4j:log4j-core:$log4jVersion"
    implementation "org.apache.logging.log4j:log4j-slf4j2-impl:$log4jVersion"

    testImplementation project(':test')
}

jar {
    manifest.attributes(
            'Agent-Class': 'gov.takx.bootstrap.AopClassTransformer',
            'Premain-Class': 'gov.takx.bootstrap.AopClassTransformer',
            'Can-Redefine-Classes': 'true',
            'TAKX-Flavor': buildFlavor.toUpperCase()
    )

    // If we are doing a local build, then sign the bootstrap jar with our developer certificate
    if (!runningUnderGitlab) {
        doLast {
            ant.signjar(
                    jar: archiveFile.get(),
                    alias: 'dev_key',
                    storetype: 'jks',
                    keystore: 'dev_key.jks',
                    storepass: 'developer',
                    keypass: 'developer',
                    preservelastmodified: 'true'
            )
        }
    }
}

// Special source set and jar to place our preferences implementation into a jar in the bin/boot directory
// so that it can be found by the executable generated by Install4J. It seems that the I4J code accesses
// the preferences very early on, which prevents any of the code in the TAKX application from being able
// to install our own preferences factory. So, we have to do it via the vmoptions file such that it is
// specified before the JVM is started. But, for this to work, the classes must be some place on the
// initial classpath, so we use bin/boot.

sourceSets {
    preferences {
        java {
            srcDir 'src/preferences/java'
        }
    }
    main {
        // Let PreferencesFactoryConstants see MemoryPreferencesFactory at compile time
        compileClasspath += sourceSets.preferences.output
    }
}

task preferencesJar(type: Jar) {
    from sourceSets.preferences.output
    archiveBaseName.set 'preferences-factory'
}

assemble.dependsOn preferencesJar


/**
 * Copy our dependencies to bin/boot
 */
task copyToBin(type: Copy, dependsOn: jar) {
    into deploymentBootDir
    from configurations.bootLibs
    from tasks.preferencesJar // Copy the preferences factory jar as well
}

assemble.dependsOn 'copyToBin'

clean {
    delete deploymentBootDir
}

apply from: rootProject.file('gradle/standardTestSetup.gradle')
