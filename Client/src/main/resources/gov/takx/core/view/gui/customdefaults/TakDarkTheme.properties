# FlatLAF has a different set of property files for SwingX components in the flatlaf-extras jar. They take precedence
# over the other theme properties. The easiest way to set our own values for SwingX components is to add them as custom
# defaults, so make sure to put any properties affecting SwingX specifically in this file or they will be ignored.
# There is a call to FlatLaf.registerCustomDefaultsSource() in UIInstaller which tells it to use this file.
# SwingX always wants certain values to be gray, regardless of the LAF/theme, so set them manually
TaskPane.titleBackgroundGradientStart=@accentColor
TaskPane.specialTitleBackground=@minimizeBar
TaskPane.titleForeground=@foregroundOpposite
TaskPane.contentInsets=0,0,0,0
TaskPane.roundHeight=0
TaskPaneContainer.background=@backgroundLighter