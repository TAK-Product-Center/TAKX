DockController.minimized.background = @background
DockController.minimized.foreground = @foreground
DockController.minimized.background.focused = $DockController.minimized.background
DockController.minimized.foreground.focused = @accentColorBold
DockController.minimized.background.selected = $DockController.minimized.background

# This one never seems to be used anyway...
DockController.minimized.foreground.selected = @accentColorBold

