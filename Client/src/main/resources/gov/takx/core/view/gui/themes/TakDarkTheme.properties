# base theme (light, dark, intellij or darcula); only used by theme editor
@baseTheme = darcula

# These are the specific colors defined in the ATAK style guide
@standardBeige = #DAD4BC
@white = #FFFFFF
@black = #000000
@sunshineYellow = #FFE35E
@pressedState = #38362F
@minimizeBar = #BBAE79
@alertRed = #F52D2D
@signpostYellow = #F9FF54
@callsignGreen = #9DFFAF
@callsignRed = #FF9D9D
@dropdownBlack = #131415
@dividers = #979797

@background = #252526
@backgroundLighter = #2D2D30
@foreground = @white
@foregroundOpposite = @black
@accentColor = @standardBeige
@accentColorBold = @sunshineYellow
@accentAlert = @alertRed
@icon = @standardBeige
@selectionInactiveBackground = @pressedState

# These are the new colors defined in the latest draft TAK style guide. However, there is no indication of how these
# colors should be used in the theme or which colors they replace from above. So for now, I'm going to stick with the
# others above in the theme and add these as colors we can grab as needed from UIManager.
# Neutrals
@sand = #CDC8B0
@brush = #9E9B83
@bark = #525348
@umber = #312D2B

# Colors
@red = #F42C2D
@orange = #FF8C04
@yellow = #E5C321
@green = #6EB84B
@blue = #10B7FE
@purple = #A250E2

# Store these colors as properties since we can't access variables outside of when the LAF is loaded
Tak.red = @red
Tak.orange = @orange
Tak.yellow = @yellow
Tak.green = @green
Tak.blue = @blue
Tak.purple = @purple

# Note: I wanted to set the pressed background to beige since that seems consistent with ATAK,
#  but there is no way to set the pressed foreground, which means this would result in light text
#  on a light background (or vice versa).
#Button.default.pressedBackground = @pressedState
#Button.pressedBackground = @standardBeige

HelpButton.questionMarkColor = @foregroundOpposite
HelpButton.background = @accentColor
HelpButton.pressedBackground = @accentColorBold

# SwingX always wants certain values to be gray, regardless of the LAF/theme, so set them manually
TaskPane.titleBackgroundGradientStart = @accentColor
TaskPane.specialTitleBackground = @minimizeBar
TaskPane.titleForeground = @foregroundOpposite
TaskPaneContainer.background = @backgroundLighter
#TaskPane.roundHeight

# To set a Docking Frames property on the DockController, prefix the properties with "DockController.";
# to set it on the dockables, prefix it with "Dockable." instead. The logic to provide the colors to the docking
# framework is in DockingColorScheme
# TODO KMB: I don't currently see any value in setting them on the individual dockables.
DockController.flap.button.border.outer = @background
DockController.flap.button.border.inner = @background
DockController.flap.button.border.edges = @background

