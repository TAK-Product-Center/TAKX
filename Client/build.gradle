plugins {
    id "net.ossindex.audit" version "0.4.11"
}

description = 'TAKX Client'

ext {
    producesLoadJar = true // Causes jar copy task to be configured
}

dependencies {
    api project(':bootstrap')
    api project(':platform')
    api project(':processmanager')
}

apply from: rootProject.file('gradle/clientDependencies.gradle')

dependencies {
    testImplementation project(':test')

    annotationProcessor "org.greenrobot:eventbus-annotation-processor:$eventbusVersion"

    // Pull in just the specific library for the current platform
    testRuntimeOnly "org.bytedeco:ffmpeg:$ffmpegVersion:$osFamily-x86_64"
}

apply from: rootProject.file('gradle/standardTestSetup.gradle')

compileJava {
    // Required argument for green-robot annotation processing, need to tell it where to put the generated index file
    options.compilerArgs << '-AeventBusIndex=gov.takx.core.event.ClientEventIndex'
}

audit {
    // All of these CVEs are coming in from our use of Spotless to format our code, and are not applicable to the
    // TAKX runtime.
    ignore = [
            'org.eclipse.platform:org.eclipse.osgi',
            'org.eclipse.platform:org.eclipse.equinox.registry',
            'org.eclipse.platform:org.eclipse.text',
            'org.eclipse.jdt:org.eclipse.jdt.core',
            'org.eclipse.platform:org.eclipse.core.resources',
            'com.google.googlejavaformat:google-java-format',
            'com.google.guava:guava:31.1-jre'
    ]
}
