plugins {
    id 'java-platform'
}

// This project publishes a BOM for consuming projects so they don't have to declare the version on any
// library that TAKX provides at runtime.

buildSupport.configurePublishing(project)

rootProject.assemble.dependsOn project.tasks.assemble // Tie in to the top-level lifecycle
tasks.build.finalizedBy 'publish' // Always publish artifacts after a build
tasks.publish.dependsOn 'build' // Make sure that artifacts are built before we try to publish if the publish task is run directly

// We need a resolvable configuration to retrieve the transitive dependencies of the declared runtimeOnly dependencies.
project(':platform').configurations {
    runtimeOnlyTransitive {
        extendsFrom runtimeOnly
        canBeResolved = true
    }
}

// Dependencies are not resolved until they are actually needed/consumed, and that typically happens at task
// execution, so we need to perform our work during task execution, BEFORE 'platform' processes its java templates,
// because that template generation needs our resolved dependencies.

def runtimeConfiguration = project(':platform').configurations.runtimeOnlyTransitive
def compileClasspath = project(':platform').configurations.compileClasspath

tasks.register('configureConstraints') {
    doLast {
        dependencies.constraints { constraintHandler ->
            // Declare all of the dependencies from our compileClasspath as our 'api' constraints.
            //
            // We need to use the resolved dependency info so we properly handle dependencies specified with no version,
            // as is the case when declaring a dependency controlled  by a BOM.

            def resolved = (Set<ResolvedDependencyResult>) compileClasspath.incoming.resolutionResult.root.dependencies
                    .findAll { it instanceof ResolvedDependencyResult }

            resolved.each {
                def moduleVersion = it.selected.moduleVersion
                constraintHandler.add('api', "${moduleVersion.group}:${moduleVersion.name}:${moduleVersion.version}")
            }

            // Declare all of the dependencies from the 'runtimeOnlyTransitive' configuration as 'runtime' constraints
            runtimeConfiguration.resolvedConfiguration.resolvedArtifacts.each {
                def id = it.moduleVersion.id
                constraintHandler.add('runtime', "${id.group}:${id.name}:${id.version}")
            }
        }
    }
}

// We need to run before java templates are processed in the main platform build
project(':platform').tasks.copyJavaTemplates.dependsOn configureConstraints
